name: sqlserver-tests

# Levanta SQL Server 2022 en un contenedor oficial, crea la base, ejecuta los scripts en orden
# y corre las pruebas. Si cualquier script o prueba falla, el workflow falla.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sqlserver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar contraseña (secreto o valor efímero enmascarado)
        env:
          SECRET_PW: ${{ secrets.MSSQL_SA_PASSWORD }}
        run: |
          PW="$SECRET_PW"
          if [ -z "$PW" ]; then PW="Ci$(openssl rand -hex 10)!aA1"; fi   # cumple la política de complejidad de SQL Server
          echo "::add-mask::$PW"
          echo "SA_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: Iniciar SQL Server 2022 (contenedor oficial)
        run: |
          docker run -d --name sqlserver \
            -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" -e MSSQL_PID=Developer \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest

      - name: Esperar a que SQL Server esté listo
        run: |
          SQLCMD=$(docker exec sqlserver bash -c 'ls /opt/mssql-tools*/bin/sqlcmd | tail -1')
          echo "SQLCMD_IN_CONTAINER=$SQLCMD" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if docker exec -e SQLCMDPASSWORD="$SA_PASSWORD" sqlserver "$SQLCMD" -S localhost -U sa -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server listo tras $i intento(s)"; exit 0
            fi
            sleep 3
          done
          echo "SQL Server no arrancó a tiempo"; docker logs sqlserver | tail -50; exit 1

      - name: Copiar el proyecto al contenedor
        run: docker cp . sqlserver:/work

      - name: Crear base, tablas, datos, vistas, consultas y procedimientos; ejecutar pruebas
        run: |
          docker exec -u 0 -e SA_PASSWORD="$SA_PASSWORD" -e SQLCMD="$SQLCMD_IN_CONTAINER" -w /work sqlserver bash scripts/run_all.sh

      - name: Recuperar el registro de ejecución
        if: always()
        run: docker cp sqlserver:/work/evidencias ./evidencias_ci || true

      - name: Publicar el registro como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-ejecucion-sqlserver
          path: evidencias_ci/ci_log.txt
          if-no-files-found: warn
